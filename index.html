<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巴士ETA">
<meta name="theme-color" content="#f5f5f0" id="themeColor">
<link rel="manifest" href="./manifest.webmanifest">
<title>巴士到站時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root,[data-theme="light"]{
    --bg:#f5f5f0;--surface:#fff;--surface2:#f9f9f7;--border:#e0ddd8;
    --text:#1a1a16;--muted:#6b6a67;--faint:#a8a7a4;
    --primary:#01696f;--primary-h:#0c4e54;--primary-l:#e0eeee;
    --success:#437a22;--warn:#c55700;--err:#a12c2c;--orange:#da7101;
    --mtr:#c00;
    --shadow-s:0 1px 3px rgba(0,0,0,.07);--shadow-m:0 4px 12px rgba(0,0,0,.08);
    --r-s:.375rem;--r-m:.625rem;--r-l:1rem;--r-f:9999px;
    --t:180ms cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"]{
    --bg:#131311;--surface:#1c1c1a;--surface2:#232320;--border:#333330;
    --text:#d4d3d0;--muted:#7a7975;--faint:#555450;
    --primary:#4f9ea3;--primary-h:#3a8389;--primary-l:#1e3434;
    --success:#6daa45;--warn:#fdab43;--err:#e06060;--orange:#fdab43;
    --mtr:#ff6666;
    --shadow-s:0 1px 3px rgba(0,0,0,.25);--shadow-m:0 4px 12px rgba(0,0,0,.35);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:'Noto Sans TC',sans-serif;font-size:1rem;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
  button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
  input,select{font:inherit;color:inherit}

  /* ── Header ── */
  .header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.875rem 1rem;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-s)}
  .logo{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;font-weight:700;color:var(--primary)}
  .theme-btn{width:2.5rem;height:2.5rem;border-radius:var(--r-f);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background var(--t)}
  .theme-btn:hover{background:var(--border);color:var(--text)}

  /* ── Layout ── */
  .main{padding:1rem;max-width:480px;margin:0 auto;padding-bottom:5rem}
  .section-label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;margin-top:1.25rem}
  .card{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--border);padding:1rem;box-shadow:var(--shadow-s)}

  /* ── Search form ── */
  .field-row{display:flex;flex-direction:column;gap:.375rem;margin-bottom:.75rem}
  .field-label{font-size:.8125rem;font-weight:500;color:var(--muted)}
  .field-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-m);padding:.625rem .75rem;font-size:1rem;width:100%;transition:border-color var(--t),box-shadow var(--t);-webkit-appearance:none;appearance:none}
  .field-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(1,105,111,.15)}
  .search-btn{background:var(--primary);color:#fff;border-radius:var(--r-m);padding:.625rem 1rem;font-size:.9375rem;font-weight:600;width:100%;margin-top:.75rem;transition:background var(--t),transform var(--t);box-shadow:var(--shadow-s)}
  .search-btn:hover{background:var(--primary-h)}
  .search-btn:active{transform:scale(.98)}
  .search-btn:disabled{opacity:.55;pointer-events:none}
  .mtr-note{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:var(--r-m);padding:.5rem .75rem;margin-top:.5rem;border:1px solid var(--border)}
  .choice-list{display:flex;flex-direction:column;gap:.5rem}
  .choice-item{width:100%;min-height:44px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:.75rem 1rem;text-align:left;box-shadow:var(--shadow-s);transition:background var(--t),border-color var(--t)}
  .choice-item:hover,.choice-item.selected{background:var(--primary-l);border-color:var(--primary)}
  .choice-route{display:block;font-size:1.05rem;font-weight:700;color:var(--primary)}
  .choice-operator{display:block;font-size:.8125rem;font-weight:600;margin-top:.125rem}
  .choice-journey{display:block;font-size:.78rem;color:var(--muted);margin-top:.125rem;overflow-wrap:anywhere}
  .choice-status{font-size:.78rem;color:var(--muted);margin-top:.5rem;text-align:center}

  /* ── Stop list ── */
  .stop-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);overflow:hidden;margin-top:.5rem}
  .stop-item{display:flex;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t);gap:.75rem}
  .stop-item:last-child{border-bottom:none}
  .stop-item:hover{background:var(--surface2)}
  .stop-item.selected{background:var(--primary-l)}
  .stop-seq{font-size:.75rem;font-weight:700;color:var(--faint);width:1.5rem;flex-shrink:0;text-align:center}
  .stop-info{flex:1;min-width:0}
  .stop-name{font-size:.9375rem;font-weight:600}
  .stop-sub{font-size:.75rem;color:var(--muted)}
  .stop-chk{color:var(--primary);flex-shrink:0;display:none}
  .stop-item.selected .stop-chk{display:block}

  /* ── ETA card ── */
  .eta-card{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--border);box-shadow:var(--shadow-m);overflow:hidden}
  .eta-head{background:var(--primary);color:#fff;padding:.875rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .eta-head.mtr{background:var(--mtr)}
  .eta-badge{font-size:1.5rem;font-weight:700;line-height:1}
  .eta-dest{font-size:.8125rem;opacity:.88}
  .eta-sname{font-size:.9rem;font-weight:600;margin-top:.25rem;opacity:.9}
  .ref-btn{width:2.25rem;height:2.25rem;border-radius:var(--r-f);background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;transition:background var(--t)}
  .ref-btn:hover{background:rgba(255,255,255,.25)}
  .ref-btn.spin svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eta-rows{padding:.25rem 0}
  .eta-row{display:flex;align-items:center;padding:.875rem 1rem;border-bottom:1px solid var(--border);gap:.75rem}
  .eta-row:last-child{border-bottom:none}
  .eta-idx{width:1.5rem;height:1.5rem;border-radius:var(--r-f);background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--muted);flex-shrink:0}
  .eta-tb{flex:1}
  .eta-hm{font-size:1.05rem;font-weight:700}
  .eta-rmk{font-size:.75rem;color:var(--muted)}
  .eta-min{font-size:1.05rem;font-weight:700;text-align:right}
  .eta-lbl{font-size:.7rem;color:var(--muted);text-align:right}
  .arriving{color:var(--warn)}
  .soon{color:var(--orange)}
  .normal{color:var(--success)}
  .gone{color:var(--err)}
  .status-box{text-align:center;padding:2.5rem 1.5rem;color:var(--muted)}
  .status-box h3{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:.375rem}
  .status-box p{font-size:.875rem}
  .upd{font-size:.75rem;color:var(--faint);text-align:center;padding:.75rem 1rem;border-top:1px solid var(--border)}
  .journey-card{margin-top:.75rem}
  .journey-card .field-input{margin-top:.375rem}
  .journey-result{font-size:1rem;font-weight:600;color:var(--primary);margin-top:.75rem;min-height:1.5rem}
  .journey-note{font-size:.75rem;color:var(--muted);margin-top:.375rem;line-height:1.5}
  .journey-note a{color:var(--primary)}

  /* ── Fav list ── */
  .fav-list{display:flex;flex-direction:column;gap:.5rem}
  .fav-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;box-shadow:var(--shadow-s)}
  .fav-pill{background:var(--primary);color:#fff;border-radius:var(--r-s);padding:.25rem .5rem;font-size:.875rem;font-weight:700;flex-shrink:0;min-width:2.75rem;text-align:center;cursor:pointer}
  .fav-pill.mtr{background:var(--mtr)}
  .fav-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:.5rem;cursor:pointer;text-align:left}
  .fav-info{flex:1;min-width:0}
  .fav-sname{font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
  .fav-dest{font-size:.75rem;color:var(--muted)}
  /* ETA mini display on fav card */
  .fav-eta{display:flex;flex-wrap:wrap;gap:.375rem 1rem;align-items:baseline}
  .fav-eta-main{font-size:1.05rem;font-weight:700;line-height:1.1}
  .fav-eta-sub{font-size:.7rem;color:var(--muted);margin-top:.1rem}
  .fav-eta.st-loading .fav-eta-main{color:var(--faint)}
  .fav-eta.st-arriving .fav-eta-main{color:var(--warn)}
  .fav-eta.st-soon .fav-eta-main{color:var(--orange)}
  .fav-eta.st-normal .fav-eta-main{color:var(--success)}
  .fav-eta.st-gone .fav-eta-main{color:var(--err)}
  .fav-eta.st-none .fav-eta-main{color:var(--faint)}
  .fav-del{width:2rem;height:2rem;border-radius:var(--r-f);display:flex;align-items:center;justify-content:center;color:var(--faint);flex-shrink:0;transition:background var(--t),color var(--t)}
  .fav-del:hover{background:var(--border);color:var(--err)}

  /* ── Save btn ── */
  .save-btn{background:none;border:1px solid var(--border);border-radius:var(--r-m);padding:.5rem .875rem;font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:.375rem;transition:all var(--t);margin-top:.75rem;width:100%;justify-content:center}
  .save-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
  .hint{font-size:.72rem;color:var(--faint);text-align:center;margin-top:.4rem}

  /* ── Toast ── */
  .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:.625rem 1.25rem;border-radius:var(--r-f);font-size:.875rem;font-weight:500;z-index:200;transition:transform 300ms cubic-bezier(.16,1,.3,1),opacity 300ms;opacity:0;white-space:nowrap;box-shadow:var(--shadow-m)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  /* V2: compact favourites, touch controls and scalable text */
  .fav-heading{display:flex;align-items:center;gap:.25rem;margin-top:.75rem}
  .fav-heading .section-label{flex:1;margin:0}
  .small-btn{min-width:44px;min-height:44px;border-radius:var(--r-m);color:var(--primary);font-size:.8125rem;padding:.25rem .5rem}
  .small-btn:hover{background:var(--primary-l)}
  .small-btn:disabled{opacity:.4;cursor:default}
  .refresh-icon{display:inline-block;font-size:1.4rem}
  .is-refreshing .refresh-icon{animation:spin 1s linear infinite}
  .fav-item{flex-wrap:wrap;align-items:flex-start}
  .fav-pill{min-height:44px;display:flex;align-items:center;justify-content:center}
  .fav-controls{display:flex;justify-content:flex-end;flex-basis:100%;border-top:1px solid var(--border)}
  .fav-controls .delete-btn{color:var(--err)}
  .fav-note{flex-basis:100%;font-size:.72rem;color:var(--muted)}
  .fav-status{font-size:.75rem;color:var(--muted);text-align:center;margin-top:.5rem;overflow-wrap:anywhere}
  .fav-status:empty{display:none}
  .theme-btn,.ref-btn{min-width:44px;min-height:44px}
  .stop-item{width:100%;text-align:left;min-height:44px}
  .stop-name,.stop-sub,.fav-dest,.eta-dest,.eta-sname,.eta-rmk{overflow-wrap:anywhere}
  .eta-head>div,.eta-tb{min-width:0}
  .eta-row{flex-wrap:wrap}
  .toast{max-width:calc(100% - 2rem);white-space:normal;text-align:center}
  .main{padding-bottom:calc(3rem + env(safe-area-inset-bottom))}
  :focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  [data-theme="dark"]{--muted:#aaa9a4;--faint:#95948f}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <rect x="2" y="6" width="22" height="14" rx="3" fill="var(--primary)" opacity=".15"/>
      <rect x="2" y="6" width="22" height="14" rx="3" stroke="var(--primary)" stroke-width="1.75"/>
      <rect x="5" y="9" width="5" height="4" rx="1" fill="var(--primary)"/>
      <rect x="11" y="9" width="5" height="4" rx="1" fill="var(--primary)"/>
      <rect x="17" y="9" width="4" height="4" rx="1" fill="var(--primary)"/>
      <circle cx="7" cy="21" r="2" fill="var(--primary)"/>
      <circle cx="19" cy="21" r="2" fill="var(--primary)"/>
    </svg>
    巴士ETA
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="切換深色模式"></button>
</header>

<main class="main">

  <!-- Favourites -->
  <div class="fav-heading">
    <h2 class="section-label">常用路線</h2>
    <button class="small-btn" id="manageFavBtn" onclick="toggleFavManagement()" aria-pressed="false">管理</button>
    <button class="small-btn" id="refreshFavBtn" onclick="refreshAllFavEtas()" aria-label="更新所有常用路線"><span class="refresh-icon" aria-hidden="true">↻</span></button>
  </div>
  <div class="fav-list" id="favList">
    <div class="status-box" style="padding:1.25rem"><p>未有常用路線，搜尋後可儲存</p></div>
  </div>
  <div class="fav-status" id="favUpdated"></div>
  <div class="fav-status" id="networkStatus" role="status"></div>
  <div class="fav-status" id="storageStatus" role="status"></div>

  <!-- Search -->
  <div class="section-label">搜尋巴士路線</div>
  <div class="card">
    <div class="field-row">
      <label class="field-label" for="routeInput">路線號碼</label>
      <input class="field-input" type="text" id="routeInput" placeholder="輸入路線，例如 58M、930、K53" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <button class="search-btn" id="searchBtn" onclick="lastSearchPromise=doSearch()">搜尋</button>
  </div>

  <!-- Unified operator results -->
  <div id="routeResultSection" style="display:none">
    <div class="section-label">搜尋結果</div>
    <div class="choice-list" id="routeResultList"></div>
    <div class="choice-status" id="routeSearchStatus" role="status"></div>
  </div>

  <!-- Direction is chosen only after a route/operator result -->
  <div id="directionSection" style="display:none">
    <div class="section-label">選擇方向</div>
    <div class="choice-list" id="directionList"></div>
    <div class="field-row" id="serviceField" style="display:none;margin-top:.75rem">
      <label class="field-label" for="serviceSelect">服務選擇</label>
      <select class="field-input" id="serviceSelect" onchange="changeService()"></select>
    </div>
    <div id="mtrNote" class="mtr-note" style="display:none">💡 港鐵巴士循環綫可能只有一個方向</div>
  </div>

  <!-- Stop list -->
  <div id="stopSection" style="display:none">
    <div class="section-label">選擇站點</div>
    <div class="stop-list" id="stopList"></div>
  </div>

  <!-- ETA detail -->
  <div id="etaSection" style="display:none">
    <div class="section-label">到站時間</div>
    <div class="eta-card">
      <div class="eta-head" id="etaHead">
        <div>
          <div class="eta-badge" id="etaBadge"></div>
          <div class="eta-dest" id="etaDest"></div>
          <div class="eta-sname" id="etaSname"></div>
        </div>
        <button class="ref-btn" id="refBtn" onclick="doRefresh()" aria-label="重新整理">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div class="eta-rows" id="etaRows"></div>
      <div class="upd" id="upd"></div>
    </div>
    <div class="card journey-card" id="journeySection" style="display:none">
      <label class="field-label" for="alightSelect">落車站</label>
      <select class="field-input" id="alightSelect" onchange="lastJourneyPromise=estimateJourney()"></select>
      <div class="journey-result" id="journeyResult" role="status">請選擇落車站</div>
      <div class="journey-note">站與站之間的歷史估算，實際車程受交通影響 · 資料來源：<a href="https://github.com/HK-Bus-ETA/hk-bus-time-between-stops" target="_blank" rel="noopener noreferrer">HK Bus ETA</a></div>
    </div>
    <button class="save-btn" onclick="saveFav()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      儲存為常用路線
    </button>
    <div class="hint">常用路線自動儲存在這部裝置，毋須重新加入主畫面</div>
  </div>

</main>
<div class="toast" id="toast" role="status"></div>

// ── Storage / legacy migration ──
function readStorage(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
  catch(e){ return fallback; }
}
function writeStorage(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}
function directionCode(dir){ return dir==='inbound'||dir==='I' ? 'I' : 'O'; }
function serviceTypeOf(f){ return String(f.serviceType || f.service_type || '1'); }
function favKey(f){
  return JSON.stringify([String(f.company).toUpperCase(), String(f.route).trim().toUpperCase(),
    directionCode(f.dir), f.company==='KMB' ? serviceTypeOf(f) : '',
    String(f.stopCode||f.stopId||'').toUpperCase()]);
}
function validFav(f){
  return f && typeof f==='object' && !Array.isArray(f) && ['KMB','CTB','MTR'].includes(f.company)
    && typeof f.route==='string' && /^[A-Z0-9]+$/i.test(f.route.trim())
    && typeof (f.stopCode||f.stopId)==='string';
}
function mergeFavs(local, incoming){
  const result = [], keys = new Map();
  for(const f of [...local, ...incoming]){
    if(!validFav(f)) continue;
    const key = favKey(f);
    if(keys.has(key)){
      const index = keys.get(key);
      // Keep local order/values, but retain additional legacy fields.
      result[index] = {...f, ...result[index]};
    }else{ keys.set(key,result.length); result.push({...f}); }
  }
  return result;
}
function loadFavs(){
  const stored = readStorage(FAVORITES_KEY, []);
  let result = mergeFavs(Array.isArray(stored)?stored:[], []);
  const m = location.hash.match(/^#favs=(.+)$/);
  if(!m) return result;
  try{
    // Preserve the original UTF-8/base64 decoding for existing shared URLs.
    const legacy = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!Array.isArray(legacy) || !legacy.every(validFav)) throw new Error('legacy');
    const savedImports = readStorage('busEtaLegacyImports', []);
    const imports = Array.isArray(savedImports) ? savedImports.filter(x=>typeof x==='string') : [];
    if(!imports.includes(m[1])) result = mergeFavs(result,legacy);
    // Never discard the only copy if storage is unavailable/full.
    if(writeStorage(FAVORITES_KEY,result) && writeStorage('busEtaLegacyImports',[...new Set([...imports,m[1]])])){
      history.replaceState(history.state,'',location.pathname+location.search);
    }else storageMessage = '未能儲存至裝置 · 舊收藏網址已保留，請勿清除';
  }catch(e){ storageMessage = '舊收藏網址未能匯入 · 原網址已保留'; }
  return result;
}
function persistFavs(){
  const saved = writeStorage(FAVORITES_KEY,favs);
  storageMessage = saved ? '' : '未能儲存至裝置 · 關閉後可能遺失更改';
  document.getElementById('storageStatus').textContent = storageMessage;

// ── Static cache / limited concurrency ──
function loadStopCache(){
  const c = readStorage('busEtaStopCache',null);
  if(c && Number.isFinite(c.timestamp) && Date.now()-c.timestamp>=0 && Date.now()-c.timestamp<CACHE_MS
    && c.entries && typeof c.entries==='object' && !Array.isArray(c.entries)) return c;
  return {timestamp:Date.now(),entries:{}};
}
function staticRequest(key, task){
  const entry = staticRequests.get(key);
  if(entry && Date.now()-entry.timestamp<CACHE_MS) return entry.promise;
  const promise = Promise.resolve().then(task).catch(e=>{ staticRequests.delete(key); throw e; });
  staticRequests.set(key,{timestamp:Date.now(),promise});
  return promise;
}
async function mapLimit(items, limit, task){
  const results = new Array(items.length);
  let next = 0;
  await Promise.all(Array.from({length:Math.min(limit,items.length)},async()=>{
    while(next<items.length){ const i=next++; results[i]=await task(items[i],i); }
  }));
  return results;
}
// One stop queue shared by overlapping searches, so the limit stays at eight.
const stopQueue = [];
let activeStops = 0;
function limitStopRequest(task){
  return new Promise((resolve,reject)=>{ stopQueue.push({task,resolve,reject}); drainStopQueue(); });
}
function drainStopQueue(){
  while(activeStops<8 && stopQueue.length){
    const job=stopQueue.shift(); activeStops++;
    Promise.resolve().then(job.task).then(job.resolve,job.reject).finally(()=>{activeStops--;drainStopQueue();});
  }
}
async function getStopInfo(co, id){
  if(Date.now()-stopCache.timestamp>=CACHE_MS) stopCache={timestamp:Date.now(),entries:{}};
  const key=co+':'+id, hit=stopCache.entries[key];
  if(hit && (typeof hit.name_tc==='string'||typeof hit.name_en==='string')) return hit;
  return staticRequest('stop:'+key,()=>limitStopRequest(async()=>{
    const response=await fj(`${co==='KMB'?KMB_API:CTB_API}/stop/${encodeURIComponent(id)}`);
    const d=response.data;
    if(!d || !(textValue(d.name_tc)||textValue(d.name_en))) throw new Error('data');
    stopCache.entries[key]={name_tc:textValue(d.name_tc),name_en:textValue(d.name_en)};
    return stopCache.entries[key];
  }));
}

// ── Network helpers ──
async function fj(url, options={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const response=await fetch(url,{...options,signal:controller.signal});
    if(!response.ok){ const error=new Error('http'); error.status=response.status; throw error; }
    const data=await response.json();
    if(!data || typeof data!=='object') throw new Error('data');
    return data;
  }finally{ clearTimeout(timer); }
}
function cycleRequest(cache,key,task){
  if(!cache.has(key)) cache.set(key,Promise.resolve().then(task));
  return cache.get(key);
}
function dataArray(response){
  if(!Array.isArray(response.data)) throw new Error('data');
  return response.data.filter(x=>x && typeof x==='object');
}
function errorMessage(e){
  if(navigator.onLine===false) return '目前離線 · 請稍後再試';
  if(e.name==='AbortError') return '連線逾時 · 請再試一次';
  if(e.status===429) return '資料繁忙 · 請稍後再試';
  if(e.status===404||e.status===422) return '找不到此路線或方向 · 請確認';
  return '暫時無法取得資料 · 請稍後再試';
}

// ── UI utilities / safe external text ──
function textValue(value){ return typeof value==='string' ? value : ''; }
function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, ms=2600){

// ── ETA formatting (shared by favourites and detail) ──
function hkTime(value){
  const d=new Date(value);
  return Number.isFinite(d.getTime()) ? d.toLocaleTimeString('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}) : '—';
}
function minsCls(m){ return m<=3?'arriving':m<=8?'soon':'normal'; }
function formatFromDate(value, now=Date.now()){
  const at=new Date(value).getTime();
  if(!Number.isFinite(at)) return null;
  const mins=Math.max(0,Math.ceil((at-now)/60000));
  return {main:at-now<=60000?'即將':`${mins} 分`,sub:hkTime(at),cls:minsCls(mins),sort:at,at};
}
function parseBusEtas(etas,now=Date.now()){
  const rows=etas.filter(e=>typeof e.eta==='string' && e.eta.trim())
    .map(e=>{ const p=formatFromDate(e.eta,now); return p?{...p,rmk:textValue(e.rmk_tc)||textValue(e.rmk_en)}:null; })
    .filter(p=>p && p.at>=now).sort((a,b)=>a.at-b.at).slice(0,3);
  const remarks=[...new Set(etas.map(e=>textValue(e.rmk_tc)||textValue(e.rmk_en)).filter(Boolean))];
  return {rows,message:rows.length?'':remarks.join(' · ')};
}
function flag(value){ return value===true||value===1||value==='1'; }
function numberValue(value){
  return (typeof value==='number'||typeof value==='string') && String(value).trim()!=='' && Number.isFinite(Number(value)) ? Number(value) : NaN;
}

// ── KMB helpers: discover valid service types; upgrade old favourites ──
function kmbRoutes(){ return staticRequest('kmb-routes',async()=>dataArray(await fj(`${KMB_API}/route/`))); }
function kmbRouteStops(route,dir,serviceType){
  return staticRequest(`kmb-stops:${route}:${dir}:${serviceType}`,async()=>
    dataArray(await fj(`${KMB_API}/route-stop/${encodeURIComponent(route)}/${dir}/${encodeURIComponent(serviceType)}`)));
}
function routeVariants(routes,route,dir){
  return routes.filter(r=>r.route===route && r.bound===directionCode(dir) && /^\d+$/.test(String(r.service_type)))
    .sort((a,b)=>Number(a.service_type)-Number(b.service_type));
}
async function resolveKmbFavourite(f){
  if(f.serviceType||f.service_type) return {...f,serviceType:serviceTypeOf(f)};
  const variants=routeVariants(await kmbRoutes(),f.route,f.dir);
  // The old app used type 1. Prefer it only if this stop is still on that service.
  for(const r of variants){
    const stops=await kmbRouteStops(f.route,f.dir,String(r.service_type));
    const matches=stops.filter(s=>s.stop===f.stopId);
    const stop=matches.find(s=>Number(s.seq)===Number(f.stopSeq)) || (matches.length===1?matches[0]:null);
    if(stop) return {...f,serviceType:String(r.service_type),stopSeq:Number(stop.seq),destName:r.dest_tc||r.dest_en||f.destName};
  }
  return {...f}; // Type 1 is a temporary filtering fallback, not a saved guess.
}
function filterBusEtas(etas,f){
  const wantedDir=f.etaDir||directionCode(f.dir);
  return etas.filter(e=>{
    if(String(e.route).toUpperCase()!==f.route.toUpperCase()) return false;
    if(e.co && e.co!==f.company) return false;
    if(e.stop && String(e.stop).toUpperCase()!==String(f.stopId).toUpperCase()) return false;
    const dir=e.dir||e.bound;
    if(dir && dir!==wantedDir) return false;
    if(numberValue(e.seq)>0 && numberValue(f.stopSeq)>0 && Number(e.seq)!==Number(f.stopSeq)) return false;
    if(f.company==='KMB' && e.service_type!=null && String(e.service_type)!==serviceTypeOf(f)) return false;
    return true;
  });
}

// ── Citybus helpers ──
function ctbRoute(route){
  return staticRequest('ctb-route:'+route,async()=>{
    const response=await fj(`${CTB_API}/route/CTB/${encodeURIComponent(route)}`);
    if(!response.data || Array.isArray(response.data) || !response.data.route){const error=new Error('not-found');error.notFound=true;throw error;}
    return response.data;
  });
}
function ctbRouteStops(route,dir){
  return staticRequest(`ctb-stops:${route}:${dir}`,async()=>dataArray(await fj(`${CTB_API}/route-stop/CTB/${encodeURIComponent(route)}/${dir}`)));
}
function ctbDestination(route,dir){
  return dir==='inbound' ? textValue(route.orig_tc)||textValue(route.orig_en) : textValue(route.dest_tc)||textValue(route.dest_en);
}
async function filterCtbEtas(etas,f){
  const direct=filterBusEtas(etas,f);
  if(parseBusEtas(direct).rows.length) return direct;
  // Never mix the opposite direction just because a normal route has no ETA.
  // Some one-direction loops label ETA differently from their route-stop list.
  // Allow that only after verifying the topology and the exact stop occurrence.
  const opposite=f.dir==='outbound'?'inbound':'outbound';
  const candidates=filterBusEtas(etas,{...f,etaDir:directionCode(opposite)});
  if(!candidates.length) return direct;
  try{
    const [selected,other]=await Promise.all([ctbRouteStops(f.route,f.dir),ctbRouteStops(f.route,opposite)]);
    if(other.length===0 && selected.some(s=>s.stop===f.stopId && Number(s.seq)===Number(f.stopSeq))){
      return [...direct,...candidates.filter(e=>Number(e.seq)===Number(f.stopSeq))];
    }
  }catch(e){ /* Without topology evidence, keep the safe direction filter. */ }
  return direct;
}

// ── MTR helpers (embedded route / stop fallback above is unchanged) ──
async function fetchMtrSchedule(route){
  const data=await fj('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:'zh',routeName:route})
  });
  if(!Array.isArray(data.busStop) && !flag(data.isSuspended)) throw new Error('data');
  return data;
}
function parseMtrBus(buses,now=Date.now()){
  if(!Array.isArray(buses)) return [];
  return buses.filter(b=>b && !flag(b.isSuspended)).map(b=>{
    const arr=numberValue(b.arrivalTimeInSecond), dep=numberValue(b.departureTimeInSecond);
    if(arr<=0 && dep<0) return null; // Explicitly departed, not "arriving".
    const sec=arr>=0 && arr<86400 ? arr : dep>=0 && dep<86400 ? dep : NaN;
    const rmk=textValue(b.busRemark)|| (flag(b.isDelayed)?'班次延誤':flag(b.isScheduled)?'預定班次':'');
    if(Number.isFinite(sec)) return {...formatFromDate(now+sec*1000,now),rmk};
    const txt=textValue(b.arrivalTimeText)||textValue(b.departureTimeText);
    return txt && !(arr<0 && dep<0) ? {main:txt,sub:'',cls:'normal',sort:Infinity,rmk} : null;
  }).filter(Boolean).sort((a,b)=>a.sort-b.sort).slice(0,3);
}
function mtrStops(route,dir){
  const all=MTR_ROUTES[route]||[];
  const selected=all.filter(s=>s.dir===directionCode(dir));
  // Preserve the existing one-direction / circular-route fallback.
  return (selected.length?selected:all).slice().sort((a,b)=>a.seq-b.seq);
}

function mtrJourneyStops(f){
  const all=MTR_ROUTES[f.route]||[];
  const selected=all.filter(s=>s.dir===directionCode(f.dir));
  const route=selected.length?selected:all;
  const variants=[];let current=[];
  // The embedded list concatenates full and short workings with repeated sequence numbers.
  // Preserve each original run, then use the longest one containing the chosen boarding stop.
  for(const stop of route){
    if(current.length && Number(stop.seq)<=Number(current[current.length-1].seq)){
      variants.push(current);current=[];
    }
    current.push(stop);
  }
  if(current.length)variants.push(current);
  const id=String(f.stopCode||f.stopId||'');
  return variants.filter(v=>v.some(s=>s.code===id&&Number(s.seq)===Number(f.stopSeq)))
    .sort((a,b)=>b.length-a.length)[0]||[];
}

// ── Shared ETA retrieval ──
async function getEtas(f, cache=new Map()){
  f={...f,route:f.route.trim().toUpperCase(),dir:directionCode(f.dir)==='I'?'inbound':'outbound'};
  if(f.company==='MTR'){
    const data=await cycleRequest(cache,'mtr:'+f.route,()=>fetchMtrSchedule(f.route));
    const stop=(data.busStop||[]).find(bs=>bs && String(bs.busStopId).toUpperCase()===String(f.stopCode||f.stopId).toUpperCase());
    const suspended=flag(data.isSuspended)||flag(stop?.isSuspended);
    if(stop?.bus!=null && !Array.isArray(stop.bus)) throw new Error('data');
    const seconds=numberValue(data.appRefreshTimeInSecond);
    return {rows:suspended?[]:parseMtrBus(stop?.bus),message:suspended?'暫停服務':textValue(stop?.busStopRemark),
      refreshMs:Number.isFinite(seconds)&&seconds>0?Math.max(REFRESH_MS,Math.min(seconds*1000,300000)):REFRESH_MS};
  }
  if(f.company==='KMB'){
    // ETA requests sharing a stop use the same Promise, including failures.
    const response=await cycleRequest(cache,'kmb:'+f.stopId,()=>fj(`${KMB_API}/stop-eta/${encodeURIComponent(f.stopId)}`));
    const etas=dataArray(response);
    let resolved=f;
    try{ resolved=await resolveKmbFavourite(f); }catch(e){ /* Keep missing serviceType unresolved for a later retry. */ }
    const result=parseBusEtas(filterBusEtas(etas,resolved));
    return {...result,resolved};
  }
  const response=await cycleRequest(cache,`ctb:${f.stopId}:${f.route}`,()=>fj(`${CTB_API}/eta/CTB/${encodeURIComponent(f.stopId)}/${encodeURIComponent(f.route)}`));
  const result=parseBusEtas(await filterCtbEtas(dataArray(response),f));
  // Correct destinations on existing favourites too; metadata failure must not hide ETA.
  try{ return {...result,resolved:{...f,destName:ctbDestination(await ctbRoute(f.route),f.dir)}}; }
  catch(e){ return result; }
}

// ── Unified route search ──
function operatorName(company){
  return company==='KMB'?'九巴 / 龍運':company==='CTB'?'城巴':'港鐵巴士';
}
function routeName(value){ return textValue(value).trim().toUpperCase(); }
function stopLabel(stop){ return textValue(stop?.tc)||textValue(stop?.en)||textValue(MTR_STOPS[stop?.code]?.tc)||textValue(stop?.code); }
function directionRecord(dir,origin,destination,extra={}){
  return {dir,origin:textValue(origin),destination:textValue(destination),...extra};
}
function makeCandidate(company,route,directions){
  if(!directions.length)return null;
  const primary=directions.find(d=>d.dir==='outbound')||directions[0];
  return {company,route,directions,origin:primary.origin,destination:primary.destination};
}
async function searchKmbCandidate(route){
  const matches=(await kmbRoutes()).filter(r=>routeName(r.route)===route && /^[OI]$/.test(textValue(r.bound))
    && /^\d+$/.test(String(r.service_type)));
  const directions=['O','I'].map(bound=>{
    const variants=matches.filter(r=>r.bound===bound).sort((a,b)=>Number(a.service_type)-Number(b.service_type));
    if(!variants.length)return null;
    const first=variants[0];
    return directionRecord(bound==='I'?'inbound':'outbound',first.orig_tc||first.orig_en,first.dest_tc||first.dest_en,{variants});
  }).filter(Boolean);
  return makeCandidate('KMB',route,directions);
}
async function searchCtbCandidate(route){
  let info;
  try{info=await ctbRoute(route);}catch(e){if(e.notFound||e.status===404||e.status===422)return null;throw e;}
  if(routeName(info.route)!==route)return null;
  const dirs=['outbound','inbound'];
  const settled=await Promise.allSettled(dirs.map(dir=>ctbRouteStops(route,dir)));
  const directions=[];
  settled.forEach((result,i)=>{
    if(result.status!=='fulfilled'||!result.value.length)return;
    const dir=dirs[i];
    directions.push(directionRecord(dir,
      dir==='outbound'?(info.orig_tc||info.orig_en):(info.dest_tc||info.dest_en),
      ctbDestination(info,dir),{stops:result.value}));
  });
  if(!directions.length && settled.some(r=>r.status==='rejected'))throw settled.find(r=>r.status==='rejected').reason;
  return makeCandidate('CTB',route,directions);
}
function searchMtrCandidate(route){
  const all=MTR_ROUTES[route]||[];
  const codes=[...new Set(all.map(s=>s.dir).filter(d=>d==='O'||d==='I'))];
  const directions=codes.map(code=>{
    const dir=code==='I'?'inbound':'outbound',stops=mtrStops(route,dir);
    return stops.length?directionRecord(dir,stopLabel(stops[0]),stopLabel(stops[stops.length-1]),{stops}):null;
  }).filter(Boolean);
  return makeCandidate('MTR',route,directions);
}
function renderRouteResults(failedCount=0){

    const operator=document.createElement('span');operator.className='choice-operator';operator.textContent=operatorName(result.company);
    const journey=document.createElement('span');journey.className='choice-journey';journey.textContent=`${result.origin||'起點'} → ${result.destination||'終點'}`;
    button.append(number,operator,journey);button.addEventListener('click',()=>chooseRouteResult(index));list.appendChild(button);
  });

}
async function doSearch(){

  if(!/^[A-Z0-9]+$/.test(route)){toast('請輸入有效路線號碼，例如 58M、930 或 K53');return;}
  const generation=++searchGeneration;
  resetJourney(true);
  detailGeneration++;detailPending=false;routeResults=[];selectedRouteResult=null;selectedDirectionIndex=-1;

function changeService(){return chooseDirection(selectedDirectionIndex,true);}
async function searchBus(co,route,dir,selection,generation){
  let stops;
  if(co==='KMB'){
    const variants=routeVariants(await kmbRoutes(),route,dir);
    if(generation!==searchGeneration) return;
    if(!variants.length){toast('找不到此路線或方向 · 請確認');return;}
    const selected=variants.find(r=>String(r.service_type)===selection.serviceType)||variants[0];
    selection.serviceType=String(selected.service_type);
    selection.destName=selected.dest_tc||selected.dest_en||'';
    const select=document.getElementById('serviceSelect'); select.replaceChildren();
    variants.forEach(r=>{
      const option=document.createElement('option'); option.value=String(r.service_type);
      option.textContent=`${r.orig_tc||r.orig_en} → ${r.dest_tc||r.dest_en}${variants.length>1?' · 服務 '+r.service_type:''}`;
      select.appendChild(option);
    });
    select.value=selection.serviceType;
    document.getElementById('serviceField').style.display=variants.length>1?'flex':'none';
    stops=await kmbRouteStops(route,dir,selection.serviceType);
  }else{
    const [routeStops,routeInfo]=await Promise.all([ctbRouteStops(route,dir),ctbRoute(route)]);
    stops=routeStops;
    selection.destName=ctbDestination(routeInfo,dir);
  }
  if(generation!==searchGeneration) return;
  if(!stops.length){toast('找不到此路線或方向 · 請嘗試另一方向');return;}
  stops=stops.slice().sort((a,b)=>Number(a.seq)-Number(b.seq));
  const details=await mapLimit(stops,8,async s=>{
    if(generation!==searchGeneration) return null;
    try{return await getStopInfo(co,s.stop);}catch(e){return null;}
  });
  writeStorage('busEtaStopCache',stopCache);
  if(generation!==searchGeneration) return;
  const list=document.getElementById('stopList'); list.replaceChildren();
  journeyStops=stops.map((s,i)=>({seq:Number(s.seq)||i+1,id:String(s.stop),name:details[i]?.name_tc||details[i]?.name_en||`站點 ${s.stop}`}));
  stops.forEach((s,i)=>{
    const d=details[i];
    const tc=d?(d.name_tc||d.name_en):`站名暫未能載入 (${s.stop})`;
    addStopEl(list,Number(s.seq)||i+1,s.stop,null,tc,d?.name_en||'',{...selection,etaDir:s.dir||s.bound||directionCode(dir)});
  });
  if(details.some(d=>!d)) toast('部分站名未能載入 · 請再搜尋以重試');
  S={...selection}; show('stopSection');
}
function searchMTR(route,dir,selection=S){
  const stops=mtrStops(route,dir);
  if(!stops.length){ toast('找不到此港鐵巴士路線 · 請確認路線號碼');return; }
  // Some embedded routes contain short workings; keep every existing stop.
  selection.dir=stops[0].dir==='I'?'inbound':'outbound';
  selection.destName=stops[stops.length-1].tc||stops[stops.length-1].en||'';
  const list=document.getElementById('stopList'); list.replaceChildren();
  journeyStops=stops.map(s=>({seq:Number(s.seq),id:s.code,name:s.tc||MTR_STOPS[s.code]?.tc||s.en||s.code}));
  stops.forEach(s=>addStopEl(list,s.seq,null,s.code,s.tc||MTR_STOPS[s.code]?.tc||s.en||s.code,s.en,selection));
  S={...selection}; show('stopSection');
}
function addStopEl(list,seq,stopId,stopCode,tc,en,selection=S){
  const button=document.createElement('button'); button.type='button'; button.className='stop-item';
  button.innerHTML=`<span class="stop-seq">${escapeHTML(seq)}</span><span class="stop-info"><span class="stop-name">${escapeHTML(tc)}</span>
    ${en&&en!==tc?`<span class="stop-sub" style="display:block">${escapeHTML(en)}</span>`:''}</span>
    <svg class="stop-chk" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
  button.addEventListener('click',()=>{lastSelectionPromise=pickStop(button,seq,stopId,stopCode,tc,selection);});
  list.appendChild(button);
}
async function pickStop(el,seq,stopId,stopCode,tc,selection=S){
  document.querySelectorAll('.stop-item').forEach(i=>{i.classList.remove('selected');i.setAttribute('aria-pressed','false');});
  el.classList.add('selected');el.setAttribute('aria-pressed','true');
  S={...selection,stopSeq:seq,stopId,stopCode,stopName:tc};
  resetJourney();
  renderJourneyOptions();
  updateDetailHead();show('etaSection');await loadETA();
}

// ── Estimated time on board (third-party adjacent-stop averages) ──
function resetJourney(clearStops=false){
  journeyGeneration++;
  if(clearStops)journeyStops=[];
  document.getElementById('journeySection').style.display='none';
  document.getElementById('alightSelect').replaceChildren();
  document.getElementById('journeyResult').textContent='請選擇落車站';
}
function journeyBoardingIndex(f=S){
  const id=f.stopCode||f.stopId;
  return journeyStops.findIndex(s=>s.seq===Number(f.stopSeq)&&s.id===String(id));
}
function renderJourneyOptions(){
  const section=document.getElementById('journeySection'),select=document.getElementById('alightSelect');
  if(S.company==='MTR')journeyStops=mtrJourneyStops(S).map(s=>({
    seq:Number(s.seq),id:s.code,name:s.tc||MTR_STOPS[s.code]?.tc||s.en||s.code
  }));
  select.replaceChildren();
  const index=journeyBoardingIndex();
  if(index<0){section.style.display='none';return;}
  const first=document.createElement('option');first.value='';first.textContent='請選擇落車站';select.appendChild(first);
  journeyStops.forEach((stop,i)=>{
    if(i<=index)return;
    const option=document.createElement('option');option.value=String(i);option.textContent=`${stop.seq}. ${stop.name}`;select.appendChild(option);
  });
  select.disabled=select.options.length===1;
  document.getElementById('journeyResult').textContent=select.disabled?'此站之後沒有落車站':'請選擇落車站';
  section.style.display='block';
}
function hkWeekdayHour(now=Date.now()){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Hong_Kong',weekday:'short',hour:'2-digit',hourCycle:'h23'}).formatToParts(now);
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.find(p=>p.type==='weekday')?.value);
  const hour=Number(parts.find(p=>p.type==='hour')?.value);
  return {day,hour:String(hour).padStart(2,'0')};
}
function journeyFile(path){
  const old=journeyRequests.get(path),now=Date.now();
  if(old && now-old.at<15*60*1000)return old.promise;
  const promise=fj(`${JOURNEY_API}/${path}`).catch(()=>fj(`${JOURNEY_RAW}/${path}`))
    .catch(e=>{journeyRequests.delete(path);throw e;});
  journeyRequests.set(path,{at:now,promise});
  return promise;
}
async function journeySeconds(stops,now=Date.now()){
  const {day,hour}=hkWeekdayHour(now);
  const prefixes=[...new Set(stops.slice(0,-1).map(s=>s.id.slice(0,2)))];
  const entries=await Promise.all(prefixes.map(async prefix=>{
    const [hourly,average]=await Promise.allSettled([
      journeyFile(`times_hourly/${day}/${hour}/${prefix}.json`),journeyFile(`times/${prefix}.json`)
    ]);
    return [prefix,{hourly:hourly.status==='fulfilled'?hourly.value:null,average:average.status==='fulfilled'?average.value:null}];
  }));
  const data=new Map(entries);let total=0,missing=0,available=false;
  for(let i=0;i<stops.length-1;i++){
    const current=stops[i].id,next=stops[i+1].id,bucket=data.get(current.slice(0,2));
    available ||= !!(bucket?.hourly||bucket?.average);
    const seconds=bucket?.hourly?.[current]?.[next] ?? bucket?.average?.[current]?.[next];
    if(typeof seconds!=='number'||!Number.isFinite(seconds)||seconds<0) missing++;
    else total+=seconds;
  }
  return {seconds:missing?null:total,missing,available};
}
async function estimateJourney(){
  const index=Number(document.getElementById('alightSelect').value);
  const start=journeyBoardingIndex(),result=document.getElementById('journeyResult');
  const generation=++journeyGeneration;
  if(!document.getElementById('alightSelect').value||start<0||index<=start||index>=journeyStops.length){
    result.textContent='請選擇落車站';return;
  }
  const stops=journeyStops.slice(start,index+1).map(s=>({id:s.id}));
  result.textContent='正在估算車程…';
  try{
    const {seconds,missing,available}=await journeySeconds(stops);
    if(generation!==journeyGeneration)return;
    result.textContent=!available?'車程資料暫時無法載入':missing?`未能估算：${missing} 段站距缺少資料`:`預計乘車約 ${Math.max(1,Math.round(seconds/60))} 分鐘`;
  }catch(e){if(generation===journeyGeneration)result.textContent='車程資料暫時無法載入';}
}
async function loadFavouriteJourneyStops(f,generation){
  try{
    const raw=f.company==='MTR'?mtrJourneyStops(f).map(s=>({seq:s.seq,id:s.code,name:stopLabel(s)}))
      :f.company==='KMB'?(await kmbRouteStops(f.route,f.dir,serviceTypeOf(f))).map(s=>({seq:s.seq,id:s.stop}))
      :(await ctbRouteStops(f.route,f.dir)).map(s=>({seq:s.seq,id:s.stop}));
    if(generation!==journeyGeneration)return;
    const ordered=raw.slice().sort((a,b)=>Number(a.seq)-Number(b.seq));
    const stops=f.company==='MTR'?ordered:await mapLimit(ordered,8,async s=>{
      try{const info=await getStopInfo(f.company,s.id);return {...s,name:info.name_tc||info.name_en||s.id};}
      catch(e){return {...s,name:s.id};}
    });
    if(generation!==journeyGeneration)return;
    journeyStops=stops.map(s=>({seq:Number(s.seq),id:String(s.id),name:s.name||s.id}));
    renderJourneyOptions();
  }catch(e){if(generation===journeyGeneration)document.getElementById('journeyResult').textContent='落車站暫時無法載入';}
}

// ── ETA detail view ──
function updateDetailHead(){
  document.getElementById('etaBadge').textContent=S.route;
  document.getElementById('etaDest').textContent='往 '+(S.destName||'終點站');
  document.getElementById('etaSname').textContent=S.stopName;
  document.getElementById('etaHead').classList.toggle('mtr',S.company==='MTR');
}
async function loadETA(cache=new Map()){
  if(!S.stopId&&!S.stopCode) return;
  const generation=++detailGeneration, selection={...S}, key=favKey(S);
  const same=key===detailKey;
  detailPending=true;
  if(!same){
    detailKey=key;lastDetailSuccess=0;
    document.getElementById('etaRows').innerHTML='<div class="status-box"><p>載入中…</p></div>';
    document.getElementById('upd').textContent='';
  }
  const btn=document.getElementById('refBtn');btn.classList.add('spin');btn.setAttribute('aria-busy','true');
  try{
    const result=await getEtas(selection,cache);
    if(generation!==detailGeneration) return;
    if(result.resolved){S={...S,...result.resolved};detailKey=favKey(S);updateDetailHead();}
    if(result.rows.length) renderDetailRows(result.rows);
    else showNoETA(result.message);
    lastDetailSuccess=Date.now();
    document.getElementById('upd').textContent='最後更新 '+hkTime(lastDetailSuccess);
  }catch(e){
    if(generation!==detailGeneration) return;
    if(!lastDetailSuccess) showNoETA(errorMessage(e),'未能取得資料');
    document.getElementById('upd').textContent=(lastDetailSuccess?'最後更新 '+hkTime(lastDetailSuccess)+' · 顯示上次資料 · ':'')+errorMessage(e);
  }finally{
    if(generation===detailGeneration){detailPending=false;btn.classList.remove('spin');btn.setAttribute('aria-busy','false');}
  }
}
function doRefresh(){return loadETA();}
function renderDetailRows(rows){
  const el=document.getElementById('etaRows');el.replaceChildren();
  rows.forEach((r,i)=>{
    const d=document.createElement('div');d.className='eta-row';
    d.innerHTML=`<div class="eta-idx">${i+1}</div><div class="eta-tb"><div class="eta-hm">${escapeHTML(r.sub||'—')}</div>
      ${r.rmk?`<div class="eta-rmk">${escapeHTML(r.rmk)}</div>`:''}</div>
      <div><div class="eta-min ${escapeHTML(r.cls)}">${escapeHTML(r.main)}</div></div>`;
    el.appendChild(d);
  });
}
function showNoETA(message='',title='暫無班次'){
  document.getElementById('etaRows').innerHTML=`<div class="status-box"><h3>${escapeHTML(title)}</h3><p>${escapeHTML(message||'此時段可能沒有服務')}</p></div>`;
}

// ── Favourites ──
function favDestination(f){
  const co=f.company==='KMB'?'九巴 / 龍運':f.company==='CTB'?'城巴':'港鐵巴士';
  return `往 ${f.destName||'終點站'} · ${co} · ${directionCode(f.dir)==='O'?'去程':'回程'}${f.company==='KMB'&&serviceTypeOf(f)!=='1'?' · 服務 '+serviceTypeOf(f):''}`;
}
function renderFavs(){
  const list=document.getElementById('favList');list.replaceChildren();
  document.getElementById('manageFavBtn').disabled=!favs.length;
  document.getElementById('refreshFavBtn').disabled=!favs.length||!!favRefresh;
  if(!favs.length){
    list.innerHTML='<div class="status-box" style="padding:1.25rem"><p>未有常用路線，搜尋後可儲存</p></div>';
    document.getElementById('favUpdated').textContent='';return;
  }
  favs.forEach((f,i)=>{
    const item=document.createElement('div');item.className='fav-item';
    const pill=document.createElement('button');pill.className='fav-pill'+(f.company==='MTR'?' mtr':'');
    pill.textContent=f.route;pill.setAttribute('aria-label',`查看 ${f.route} ${f.stopName} 到站時間`);
    pill.addEventListener('click',()=>loadFav(i));item.appendChild(pill);
    const main=document.createElement('button');main.className='fav-main';main.addEventListener('click',()=>loadFav(i));
    main.innerHTML=`<span class="fav-info"><span class="fav-sname" style="display:block">${escapeHTML(f.stopName)}</span>
      <span class="fav-dest">${escapeHTML(favDestination(f))}</span></span>
      <span class="fav-eta" id="fe-${i}"></span>`;
    item.appendChild(main);
    if(managingFavs){
      const controls=document.createElement('div');controls.className='fav-controls';
      [['↑','上移',()=>moveFav(i,-1),i===0],['↓','下移',()=>moveFav(i,1),i===favs.length-1],['刪除','刪除',()=>delFav(i),false]].forEach(([label,action,handler,disabled])=>{
        const b=document.createElement('button');b.className='small-btn'+(action==='刪除'?' delete-btn':'');b.textContent=label;
        b.setAttribute('aria-label',`${action} ${f.route} ${f.stopName}`);b.disabled=disabled;b.addEventListener('click',handler);controls.appendChild(b);
      });item.appendChild(controls);
    }
    list.appendChild(item);renderFavEta(i,f);
  });
}
function renderFavEta(i,f){
  const box=document.getElementById('fe-'+i);if(!box)return;
  const result=favResults.get(favKey(f));
  if(!result){box.innerHTML='<span class="fav-eta-sub">待更新</span>';return;}
  if(result.rows?.length){
    box.innerHTML=result.rows.map(r=>`<span class="fav-eta-main ${escapeHTML(r.cls)}" title="${escapeHTML([r.sub,r.rmk].filter(Boolean).join(' · '))}" aria-label="${escapeHTML([r.main,r.sub,r.rmk].filter(Boolean).join('，'))}">${escapeHTML(r.main)}</span>`).join('');
  }else box.innerHTML=`<span class="fav-eta-sub">${result.error?'未能取得資料':'暫無班次'}</span>`;
  if(result.error||result.message){
    const note=document.createElement('span');note.className='fav-note';
    note.textContent=result.error?(result.updated?'顯示上次資料 · '+hkTime(result.updated):errorMessage(result.error)):result.message;
    box.appendChild(note);
  }
}
function applyResolvedFavourite(f,resolved){
  if(!resolved||!favs.includes(f))return f;
  let target=f;
  if(resolved.serviceType!==f.serviceType||resolved.stopSeq!==f.stopSeq||resolved.destName!==f.destName){
    Object.assign(f,resolved);
    // Resolution can reveal that a legacy entry duplicates a newer saved service.
    const duplicate=favs.find(other=>other!==f && favKey(other)===favKey(f));
    if(duplicate){
      const first=favs.indexOf(f)<favs.indexOf(duplicate)?f:duplicate;
      const second=first===f?duplicate:f;
      Object.assign(first,{...second,...first});
      favs.splice(favs.indexOf(second),1);
      target=first;
    }
    persistFavs();
  }
  return target;
}
function refreshAllFavEtas(cache=new Map()){
  if(favRefresh) return favRefresh;
  if(!favs.length)return Promise.resolve();
  const snapshot=favs.slice(), btn=document.getElementById('refreshFavBtn');
  btn.disabled=true;btn.classList.add('is-refreshing');btn.setAttribute('aria-busy','true');
  favRefresh=(async()=>{
    const outcomes=await mapLimit(snapshot,6,async f=>{
      const oldKey=favKey(f), previous=favResults.get(oldKey);
      try{
        const result=await getEtas(f,cache);
        if(!favs.includes(f))return false;
        const target=applyResolvedFavourite(f,result.resolved);
        favResults.set(favKey(target),{...result,updated:Date.now()});
        if(favs.length!==snapshot.length)renderFavs();
        const i=favs.indexOf(target);
        renderFavEta(i,target);
        const dest=document.querySelectorAll('#favList .fav-dest')[i];
        if(dest)dest.textContent=favDestination(target);
        return true;
      }catch(e){
        if(favs.includes(f)){
          favResults.set(favKey(f),{...previous,error:e});
          renderFavEta(favs.indexOf(f),f);
        }
        return false;
      }
    });
    if(outcomes.some(Boolean))lastFavSuccess=Date.now();
    document.getElementById('favUpdated').textContent=favs.length&&lastFavSuccess?'最後更新 '+hkTime(lastFavSuccess):'';
    updateNetworkStatus();
  })().finally(()=>{
    favRefresh=null;btn.disabled=!favs.length;btn.classList.remove('is-refreshing');btn.setAttribute('aria-busy','false');
  });
  return favRefresh;
}
function saveFav(){
  if(!S.stopId&&!S.stopCode){toast('請先選擇站點');return;}
  if(favs.some(f=>favKey(f)===favKey(S))){toast('已儲存過此站點');return;}
  favs.push({...S});const saved=persistFavs();renderFavs();
  // If an existing cycle is in flight, follow it with one fresh cycle for the new card.
  const pending=favRefresh;
  if(pending)pending.then(()=>refreshAllFavEtas());else refreshAllFavEtas();
  toast(saved?'✓ 已儲存常用路線':storageMessage);
}
function delFav(i){
  const removed=favs.splice(i,1)[0];if(removed)favResults.delete(favKey(removed));
  persistFavs();renderFavs();updateNetworkStatus();toast('已刪除');
}
function moveFav(i,delta){
  const to=i+delta;if(to<0||to>=favs.length)return;
  [favs[i],favs[to]]=[favs[to],favs[i]];persistFavs();renderFavs();
  document.querySelectorAll('.fav-controls')[to]?.querySelector(delta<0?'button':'button:nth-child(2)')?.focus();
}
function toggleFavManagement(){
  managingFavs=!managingFavs;
  const btn=document.getElementById('manageFavBtn');btn.textContent=managingFavs?'完成':'管理';btn.setAttribute('aria-pressed',String(managingFavs));renderFavs();
}
async function loadFav(i){
  const f=favs[i];if(!f)return;
  invalidateSearch();
  document.getElementById('routeInput').value=f.route;
  S={...f};updateDetailHead();show('etaSection');
  document.getElementById('journeySection').style.display='block';
  document.getElementById('alightSelect').disabled=true;
  document.getElementById('journeyResult').textContent='正在載入沿途站點…';
  const generation=journeyGeneration;
  await loadETA();
  if(generation===journeyGeneration)await loadFavouriteJourneyStops({...S},generation);
}

// ── Theme ──
(function(){
  const html=document.documentElement,btn=document.getElementById('themeBtn');
  const media=window.matchMedia('(prefers-color-scheme:dark)');
  let preference=readStorage('busEtaTheme',null);
  if(!['light','dark'].includes(preference))preference=null;
  const moon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const sun='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  function apply(){
    const dark=preference?preference==='dark':media.matches;
    html.setAttribute('data-theme',dark?'dark':'light');btn.innerHTML=dark?sun:moon;
    btn.setAttribute('aria-label',dark?'切換淺色模式':'切換深色模式');
    document.getElementById('themeColor').setAttribute('content',dark?'#131311':'#f5f5f0');
  }
  btn.addEventListener('click',()=>{preference=html.getAttribute('data-theme')==='dark'?'light':'dark';writeStorage('busEtaTheme',preference);apply();});
  media.addEventListener('change',()=>{if(!preference)apply();});apply();
})();

// ── Lifecycle / init: one visible-page refresh loop ──
function updateNetworkStatus(){
  const hasOld=favs.some(f=>favResults.get(favKey(f))?.updated);
  const failed=favs.some(f=>favResults.get(favKey(f))?.error);
  document.getElementById('networkStatus').textContent=navigator.onLine===false
    ? '目前離線'+(hasOld?' · 顯示上次資料':' · 連線後更新到站時間')
    : failed?'部分資料未能更新 · 請稍後重試':'';
}
function favouritesStale(){
  return favs.some(f=>{
    const r=favResults.get(favKey(f));
    return !r?.updated||Date.now()-r.updated>=(r.refreshMs||REFRESH_MS);
  });
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);refreshTimer=null;
  if(!document.hidden)refreshTimer=setTimeout(refreshVisible,REFRESH_MS);
}
async function refreshVisible(force=false){
  clearTimeout(refreshTimer);refreshTimer=null;
  if(document.hidden)return;
  const cache=new Map(), jobs=[];
  if(force||favouritesStale())jobs.push(refreshAllFavEtas(cache));
  if((S.stopId||S.stopCode)&&!detailPending&&(force||Date.now()-lastDetailSuccess>=REFRESH_MS))jobs.push(loadETA(cache));
  await Promise.allSettled(jobs);
  scheduleRefresh();
}
document.getElementById('routeInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();invalidateSearch();});
document.getElementById('routeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lastSearchPromise=doSearch();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(refreshTimer);refreshTimer=null;}else refreshVisible();});
window.addEventListener('pageshow',()=>refreshVisible());
window.addEventListener('pagehide',()=>{clearTimeout(refreshTimer);refreshTimer=null;});
window.addEventListener('offline',updateNetworkStatus);
window.addEventListener('online',()=>{updateNetworkStatus();refreshVisible(true);});
document.getElementById('storageStatus').textContent=storageMessage;
renderFavs();updateNetworkStatus();refreshVisible(true);

</script>
